<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Arquitectura en tres capas de una API Spring Boot</title>
<desc id="d">El cliente llama a la capa de presentación (controlador y dto), que llama a la capa de negocio (service y model), que llama a la capa de persistencia (repository), que accede a la base de datos. Cada capa solo habla con la de abajo.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tres capas: cada una habla solo con la de abajo</text>
<rect x="40" y="60" width="140" height="50" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="110.0" y="90.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Cliente</text>
<rect x="240" y="140" width="290" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="385.0" y="164.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1 · presentacion</text>
<text x="385.0" y="183.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">controlador · dto · excepcion</text>
<text x="550" y="174" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">recibe HTTP y responde</text>
<path d="M385 198 V223" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="224" width="290" height="58" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="385.0" y="248.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2 · negocio</text>
<text x="385.0" y="267.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">service · model · excepcion</text>
<text x="550" y="258" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">lógica y entidades</text>
<path d="M385 282 V307" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="308" width="290" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="385.0" y="332.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3 · persistence</text>
<text x="385.0" y="351.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">repository</text>
<text x="550" y="342" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">acceso a datos</text>
<path d="M385 366 V391" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="392" width="290" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="385.0" y="416.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Base de datos</text>
<text x="385.0" y="435.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">H2 / MySQL / PostgreSQL</text>
<text x="550" y="426" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">persistencia real</text>
<path d="M110 112 C110 130 140 150 238 160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="740" y="150" width="140" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="810.0" y="203.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Reglas</text>
<text x="810.0" y="220.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">Una capa solo</text>
<text x="810.0" y="237.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">usa a la de abajo</text>
<text x="810.0" y="254.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">El controlador no</text>
<text x="810.0" y="271.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">toca el repositorio</text>
<text x="810.0" y="288.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">Sin dao/ ni vista/:</text>
<text x="810.0" y="305.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">Spring los reemplaza</text>
</svg>
