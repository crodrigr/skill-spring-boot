<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Arquitectura en capas de una API Spring Boot</title>
<desc id="d">El cliente llama al controlador, que llama al servicio, que llama al repositorio, que accede a la base de datos. Cada capa solo habla con la de abajo.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Cada capa habla solo con la de abajo</text>
<rect x="40" y="60" width="140" height="50" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="110.0" y="90.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Cliente</text>
<rect x="240" y="130" width="260" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="370.0" y="153.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Controller</text>
<text x="370.0" y="172.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">@RestController</text>
<text x="520" y="164" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">recibe HTTP y responde</text>
<path d="M370 186 V213" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="214" width="260" height="56" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="370.0" y="237.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Service</text>
<text x="370.0" y="256.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">@Service</text>
<text x="520" y="248" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">lógica de negocio</text>
<path d="M370 270 V297" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="298" width="260" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="370.0" y="321.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Repository</text>
<text x="370.0" y="340.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">JpaRepository</text>
<text x="520" y="332" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">acceso a datos</text>
<path d="M370 354 V381" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="382" width="260" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="370.0" y="405.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Database</text>
<text x="370.0" y="424.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">H2 / MySQL / PostgreSQL</text>
<text x="520" y="416" text-anchor="start" font-size="14" font-weight="400" fill="#64748b">persistencia</text>
<path d="M110 112 C110 130 140 150 238 160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="720" y="150" width="150" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="795.0" y="209.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Reglas</text>
<text x="795.0" y="227.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">No saltarse capas</text>
<text x="795.0" y="245.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">El controlador no</text>
<text x="795.0" y="263.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">toca la base de datos</text>
<text x="795.0" y="281.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">El servicio no sabe</text>
<text x="795.0" y="299.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">de HTTP</text>
</svg>
