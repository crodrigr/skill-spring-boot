<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">De tu código a la documentación navegable</title>
<desc id="d">springdoc-openapi lee los controladores y las entidades, genera la definición OpenAPI en /v3/api-docs y Swagger UI la muestra en /swagger-ui.html.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="328" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Documentación automática con springdoc-openapi</text>
<rect x="30" y="100" width="170" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="115.0" y="136.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Tu API</text>
<text x="115.0" y="154.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">controladores,</text>
<text x="115.0" y="172.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">entidades, anotaciones</text>
<rect x="255" y="100" width="170" height="100" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="340.0" y="136.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">springdoc-openapi</text>
<text x="340.0" y="154.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">lee el código</text>
<text x="340.0" y="172.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">al arrancar</text>
<rect x="480" y="100" width="170" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="565.0" y="135.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">OpenAPI</text>
<text x="565.0" y="154.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">/v3/api-docs</text>
<text x="565.0" y="173.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">(JSON)</text>
<rect x="705" y="100" width="165" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="787.5" y="136.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Swagger UI</text>
<text x="787.5" y="154.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">/swagger-ui.html</text>
<text x="787.5" y="172.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">(navegable)</text>
