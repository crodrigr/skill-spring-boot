<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Contenedor IoC y contexto de Spring Boot</title>
<desc id="d">SpringApplication.run crea el ApplicationContext, que es el contenedor IoC. @SpringBootApplication escanea las clases anotadas, y el contexto crea los beans, les inyecta sus dependencias y gestiona su ciclo de vida. El código del desarrollador, como Main, le pide beans al contexto o los recibe inyectados.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="538" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Spring Boot: contenedor IoC y contexto</text>
<text x="125" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">1 · Tus clases</text>
<rect x="30" y="90" width="190" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="125.0" y="117.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ControladorCatalogo</text>
<text x="125.0" y="135.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">@RestController</text>
<rect x="30" y="174" width="190" height="64" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="125.0" y="201.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ServicioPrestamos</text>
<text x="125.0" y="219.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">@Service</text>
<rect x="30" y="258" width="190" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="125.0" y="285.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">RepositorioLibros</text>
<text x="125.0" y="303.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">@Repository</text>
<path d="M222 186 H300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="262" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">escanea</text>
<text x="262" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">y registra</text>
<text x="262" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">@SpringBoot</text>
<text x="262" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Application</text>
<rect x="305" y="64" width="570" height="330" rx="18" fill="#f1f5f9" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6"/>
<text x="590" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">ApplicationContext  =  el contenedor IoC</text>
<text x="590" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">lo crea SpringApplication.run(...) al arrancar</text>
<rect x="330" y="140" width="160" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="410.0" y="163.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">ControladorCatalogo</text>
<text x="410.0" y="180.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">(bean)</text>
<rect x="520" y="140" width="160" height="56" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="600.0" y="163.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">ServicioPrestamos</text>
<text x="600.0" y="180.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">(bean)</text>
<rect x="710" y="140" width="150" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="785.0" y="163.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">RepositorioLibros</text>
<text x="785.0" y="180.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">(bean)</text>
<path d="M492 168 H518" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M682 168 H708" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="505" y="134" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">inyecta</text>
<text x="695" y="134" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">inyecta</text>
<rect x="330" y="230" width="530" height="128" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="595.0" y="262.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">El contenedor se encarga de:</text>
<text x="595.0" y="280.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">1. crear cada bean (una sola instancia: singleton)</text>
<text x="595.0" y="298.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">2. inyectarle sus dependencias</text>
<text x="595.0" y="316.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">3. inicializarlo (@PostConstruct) y tenerlo disponible</text>
<text x="595.0" y="334.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">4. destruirlo al cerrar (@PreDestroy)</text>
<rect x="330" y="420" width="200" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="430.0" y="445.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Main / tu código</text>
<text x="430.0" y="463.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">pide beans o los recibe</text>
<path d="M430 418 V362" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="442" y="412" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">getBean(...) o constructor</text>
<rect x="660" y="420" width="210" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="765.0" y="445.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">application.properties</text>
<text x="765.0" y="463.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">configuración externa</text>
<path d="M765 418 V362" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="775" y="412" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">configura</text>
<text x="450" y="520" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Tú declaras qué necesita cada clase; el contexto decide cuándo crearla y cómo entregarla.</text>
</svg>
