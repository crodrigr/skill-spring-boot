<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">FilterChainProxy y SecurityFilterChain</title>
<desc id="d">DelegatingFilterProxy conecta el contenedor de servlets con Spring; FilterChainProxy decide qué SecurityFilterChain aplicar según la URL de la solicitud.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="338" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Quién es quién detrás de la Security Filter Chain</text>
<rect x="30" y="110" width="170" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="115.0" y="145.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Solicitud</text>
<text x="115.0" y="164.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">HTTP</text>
<rect x="240" y="110" width="200" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="340.0" y="145.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">DelegatingFilterProxy</text>
<text x="340.0" y="162.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">puente con el servlet</text>
<rect x="480" y="110" width="170" height="80" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="565.0" y="145.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">FilterChainProxy</text>
<text x="565.0" y="163.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">elige la cadena</text>
<path d="M202 150 H238" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M442 150 H478" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="700" y="60" width="170" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="785.0" y="85.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">SecurityFilterChain</text>
<text x="785.0" y="102.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">/api/** (JWT)</text>
<rect x="700" y="200" width="170" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="785.0" y="225.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">SecurityFilterChain</text>
<text x="785.0" y="242.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">/publico/** (libre)</text>
<path d="M652 140 L698 100" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M652 160 L698 218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="450" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Cada SecurityFilterChain se asocia a un patrón de URL; solo se aplica la primera que coincide</text>
</svg>
