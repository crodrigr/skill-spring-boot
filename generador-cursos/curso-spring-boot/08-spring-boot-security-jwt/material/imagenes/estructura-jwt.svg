<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Estructura de un JWT</title>
<desc id="d">Un JWT son tres partes separadas por puntos: el header con el algoritmo, el payload con los datos y la firma calculada con una clave secreta. Header y payload son Base64 legibles; la firma impide la manipulación.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="318" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">header . payload . signature</text>
<rect x="30" y="64" width="260" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="160" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Header</text>
<text x="52" y="128" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">{ "alg": "HS256",</text>
<text x="52" y="150" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">  "typ": "JWT" }</text>
<text x="160" y="184" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">tipo y algoritmo</text>
<text x="160" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Base64 (legible)</text>
<circle cx="305" cy="139" r="5" fill="#1f2937"/>
<rect x="320" y="64" width="260" height="150" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="450" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Payload</text>
<text x="342" y="128" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">{ "sub": "ana",</text>
<text x="342" y="150" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">  "exp": 1766000000 }</text>
<text x="450" y="184" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">datos del usuario</text>
<text x="450" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">Base64 (legible)</text>
<circle cx="595" cy="139" r="5" fill="#1f2937"/>
<rect x="610" y="64" width="260" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="740" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Signature</text>
<text x="632" y="128" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">HMACSHA256(</text>
<text x="632" y="150" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2937" xml:space="preserve">  header.payload, clave )</text>
<text x="740" y="184" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">prueba de integridad</text>
<text x="740" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">requiere la clave secreta</text>
<rect x="40" y="246" width="820" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450.0" y="268.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Base64 no es encriptación: cualquiera lee header y payload</text>
<text x="450.0" y="286.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">la firma protege contra la manipulación, no contra la lectura</text>
</svg>
