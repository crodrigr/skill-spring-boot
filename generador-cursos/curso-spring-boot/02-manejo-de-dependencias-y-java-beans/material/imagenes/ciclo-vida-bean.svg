<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Ciclo de vida de un bean</title>
<desc id="d">Cinco fases del bean: instanciación, configuración mediante inyección de dependencias, inicialización con PostConstruct, uso y destrucción con PreDestroy.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="298" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Ciclo de vida de un bean (5 fases)</text>
<rect x="24" y="90" width="150" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="99.0" y="135.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. Instanciación</text>
<text x="99.0" y="154.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">crea el objeto</text>
<path d="M174 140 H198" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="200" y="90" width="150" height="100" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="275.0" y="125.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. Configuración</text>
<text x="275.0" y="144.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">inyección de</text>
<text x="275.0" y="163.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">dependencias</text>
<path d="M350 140 H374" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="376" y="90" width="150" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="451.0" y="135.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. Inicialización</text>
<text x="451.0" y="154.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">@PostConstruct</text>
<path d="M526 140 H550" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="552" y="90" width="150" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="627.0" y="125.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. Uso</text>
<text x="627.0" y="144.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">la aplicación</text>
<text x="627.0" y="163.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">lo utiliza</text>
<path d="M702 140 H726" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="728" y="90" width="150" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="803.0" y="135.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">5. Destrucción</text>
<text x="803.0" y="154.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">@PreDestroy</text>
<text x="450" y="240" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b">Con inyección por constructor, las fases 1 y 2 ocurren casi a la vez, pero siguen siendo distintas</text>
</svg>
