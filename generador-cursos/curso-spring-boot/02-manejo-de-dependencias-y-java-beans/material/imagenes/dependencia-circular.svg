<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Dependencia circular</title>
<desc id="d">ServicioA necesita a ServicioB y ServicioB necesita a ServicioA, así que ninguno de los dos puede construirse primero.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="328" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dependencia circular: el anti-patrón</text>
<rect x="110" y="110" width="220" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="220.0" y="145.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">ServicioA</text>
<text x="220.0" y="165.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">necesita a ServicioB</text>
<rect x="570" y="110" width="220" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="680.0" y="145.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">ServicioB</text>
<text x="680.0" y="165.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">necesita a ServicioA</text>
<path d="M332 135 H566" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M568 168 H334" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="450" y="124" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">¿quién se crea primero?</text>
<rect x="210" y="240" width="480" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="450.0" y="263.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Se resuelve reorganizando responsabilidades</text>
<text x="450.0" y="282.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">no cambiando la forma de inyección</text>
</svg>
