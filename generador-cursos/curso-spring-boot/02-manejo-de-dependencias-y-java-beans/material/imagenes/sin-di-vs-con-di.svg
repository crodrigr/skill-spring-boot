<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Sin inyección de dependencias y con ella</title>
<desc id="d">A la izquierda, el servicio crea su repositorio con new y queda atado a una implementación. A la derecha, el contenedor crea el repositorio y se lo entrega al servicio, que solo conoce la interfaz.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La clase deja de crear sus dependencias</text>
<line x1="450" y1="60" x2="450" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="225" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">Sin inyección</text>
<text x="675" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">Con inyección</text>
<rect x="40" y="110" width="370" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="225.0" y="140.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ServicioPrestamos</text>
<text x="225.0" y="158.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">repo = new RepositorioLibrosEnMemoria()</text>
<path d="M225 182 V228" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="100" y="230" width="250" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="225.0" y="255.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">RepositorioLibrosEnMemoria</text>
<text x="225.0" y="273.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">(implementación fija)</text>
<text x="225" y="325" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Acoplado: imposible de reemplazar en un test</text>
<rect x="480" y="100" width="160" height="56" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="560.0" y="123.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Contenedor</text>
<text x="560.0" y="142.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Spring</text>
<rect x="690" y="100" width="190" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="785.0" y="123.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ServicioPrestamos</text>
<text x="785.0" y="141.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">solo conoce la interfaz</text>
<path d="M642 128 H688" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="665" y="118" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">inyecta</text>
<rect x="690" y="230" width="190" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="785.0" y="253.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">«interface»</text>
<text x="785.0" y="271.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">RepositorioLibros</text>
<path d="M785 158 V228" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="840" y="198" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">depende de</text>
<rect x="480" y="230" width="140" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="550.0" y="253.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Implementación</text>
<text x="550.0" y="270.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">real o de prueba</text>
<path d="M622 258 H688" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="655" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">implementa</text>
<path d="M560 158 V228" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="618" y="198" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">la crea y elige</text>
<text x="675" y="325" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Desacoplado: el servicio solo conoce la interfaz</text>
</svg>
