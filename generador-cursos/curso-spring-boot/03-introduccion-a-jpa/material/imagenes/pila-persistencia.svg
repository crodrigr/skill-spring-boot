<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">La pila de persistencia en Spring Boot</title>
<desc id="d">De arriba abajo: tu código usa un repositorio de Spring Data JPA, que se apoya en la especificación JPA, implementada por Hibernate, que habla con la base de datos mediante JDBC.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="458" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Quién hace qué en la persistencia</text>
<rect x="120" y="56" width="660" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="78.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Tu código</text>
<text x="450.0" y="97.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">PacienteRepository extends JpaRepository</text>
