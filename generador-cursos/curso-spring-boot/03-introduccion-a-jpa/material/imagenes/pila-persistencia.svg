<rect x="120" y="138" width="660" height="54" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="450.0" y="160.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Spring Data JPA</text>
<text x="450.0" y="179.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">genera la implementación del repositorio</text>
<path d="M450 192 V219" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="120" y="220" width="660" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="450.0" y="242.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">JPA (especificación)</text>
<text x="450.0" y="261.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">jakarta.persistence: @Entity, EntityManager…</text>
