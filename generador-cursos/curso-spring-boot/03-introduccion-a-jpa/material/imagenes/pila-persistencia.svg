<rect x="120" y="384" width="660" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="450.0" y="406.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">JDBC → Base de datos</text>
