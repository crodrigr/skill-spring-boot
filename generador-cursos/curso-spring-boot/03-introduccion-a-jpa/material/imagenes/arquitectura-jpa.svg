<text x="484" y="95" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">genera</text>
<rect x="280" y="230" width="180" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="370.0" y="260.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Entidades</text>
<text x="370.0" y="280.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">@Entity</text>
<rect x="490" y="230" width="180" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="580.0" y="260.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Query / JPQL</text>
<text x="580.0" y="280.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">consultas</text>
<rect x="700" y="230" width="170" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="785.0" y="260.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">EntityTransaction</text>
<text x="785.0" y="278.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">confirma o revierte</text>
