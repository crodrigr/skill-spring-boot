<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Arquitectura de JPA</title>
<desc id="d">La unidad de persistencia, configurada desde application.properties, crea el EntityManagerFactory; este produce EntityManager, que gestiona entidades, ejecuta consultas JPQL y trabaja dentro de una EntityTransaction.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="418" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Componentes de la arquitectura de JPA</text>
<rect x="40" y="70" width="180" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="130.0" y="92.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Unidad de</text>
<text x="130.0" y="109.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">persistencia</text>
<text x="130.0" y="126.2" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">(application.properties)</text>
<rect x="270" y="70" width="190" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="365.0" y="100.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">EntityManagerFactory</text>
<text x="365.0" y="119.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">punto de entrada</text>
<rect x="510" y="70" width="190" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="605.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">EntityManager</text>
<text x="605.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">componente central</text>
<path d="M220 105 H268" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="244" y="95" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">crea</text>
