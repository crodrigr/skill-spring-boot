<text x="670.0" y="264.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">RuntimeException</text>
<path d="M670 208 V234" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="440" y="330" width="210" height="48" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="545.0" y="358.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">NullPointerException</text>
<rect x="680" y="330" width="200" height="48" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="780.0" y="349.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">LibroNoEncontrado</text>
<text x="780.0" y="366.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">Exception (tuya)</text>
