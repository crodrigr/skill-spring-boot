<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Jerarquía de Throwable</title>
<desc id="d">Throwable se divide en Error, problemas graves que no deberían capturarse, y Exception, condiciones que una aplicación razonable puede capturar; de Exception cuelga RuntimeException, de la que derivan NullPointerException y las excepciones de negocio propias.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">La jerarquía de Throwable</text>
<rect x="360" y="56" width="180" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="450.0" y="85.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Throwable</text>
<rect x="110" y="150" width="200" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="210.0" y="173.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Error</text>
<text x="210.0" y="192.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">no debería capturarse</text>
<rect x="570" y="150" width="200" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="173.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Exception</text>
<text x="670.0" y="192.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">capturable</text>
<path d="M420 106 L260 148" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M480 106 L640 148" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="110" y="260" width="200" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="210.0" y="288.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">StackOverflowError</text>
<path d="M210 208 V258" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
