<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Camino de una excepción en una API</title>
<desc id="d">Una excepción lanzada en el servicio sube al controlador. Con ControllerAdvice la captura un manejador global que devuelve un código HTTP y un cuerpo JSON claros; sin ningún manejo, el cliente recibe un 500 genérico.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="898" height="418" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">¿Qué pasa cuando el servicio lanza una excepción?</text>
<rect x="30" y="80" width="130" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="95.0" y="113.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Cliente</text>
<rect x="220" y="80" width="150" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="295.0" y="113.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Controller</text>
<rect x="430" y="80" width="150" height="56" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="505.0" y="113.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Service</text>
<rect x="640" y="80" width="220" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="750.0" y="103.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">lanza LibroNoEncontrado</text>
<text x="750.0" y="120.7" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">Exception</text>
<path d="M162 108 H218" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M372 108 H428" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M582 108 H638" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="450" y="172" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">La excepción sube por la pila de llamadas</text>
<line x1="30" y1="190" x2="870" y2="190" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="30" y="215" width="400" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="230.0" y="267.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Sin manejo</text>
<text x="230.0" y="285.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">500 Internal Server Error</text>
<text x="230.0" y="303.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">mensaje genérico, detalle interno</text>
<text x="230.0" y="321.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">expuesto, el cliente no sabe qué falló</text>
<rect x="470" y="215" width="400" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="670.0" y="267.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Con @ControllerAdvice</text>
<text x="670.0" y="285.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">@ExceptionHandler captura la excepción</text>
<text x="670.0" y="303.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">404 Not Found</text>
<text x="670.0" y="321.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">{ "mensaje": "Libro 7 no existe" }</text>
</svg>
